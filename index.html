
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingAnalyzer — XAU/USD</title>
<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101722;color:#edf3fa;font-family:Arial,sans-serif}
header{padding:14px}
h2{margin:0 0 7px}
small{color:#9aabc0}
.controls,.settings{display:flex;flex-wrap:wrap;gap:7px;padding:8px 12px}
button{background:#253449;color:white;border:0;border-radius:6px;padding:10px 12px;cursor:pointer}
button.active{background:#1686f8}
#chart{height:58vh;min-height:340px;width:100%}
.panel{margin:10px;padding:12px;background:#182434;border-radius:8px}
.panel label{display:inline-flex;align-items:center;gap:6px;margin:7px 12px 7px 0}
#status{padding:10px 14px;color:#b8c9dc;font-size:13px}
</style>
</head>
<body>
<header>
<h2>TradingAnalyzer</h2>
<div><strong>XAU/USD — Or contre dollar</strong></div>
<small>Graphique personnalisé • Données de marché</small>
</header>

<div class="controls" id="timeframes">
<button data-tf="1min">1 min</button>
<button data-tf="5min" class="active">5 min</button>
<button data-tf="15min">15 min</button>
<button data-tf="1h">1 h</button>
<button data-tf="4h">4 h</button>
<button data-tf="1day">1 jour</button>
</div>

<div id="chart"></div>
<div id="status">Connexion aux données du marché…</div>

<div class="panel">
<strong>Réglages des analyses</strong><div class="settings">
  <strong>Unités FVG à afficher :</strong>
  <label><input type="checkbox" class="fvg-tf" value="15min" checked> 15 min</label>
  <label><input type="checkbox" class="fvg-tf" value="1h" checked> 1 h</label>
  <label><input type="checkbox" class="fvg-tf" value="4h" checked> 4 h</label>
  <label><input type="checkbox" class="fvg-tf" value="1day"> 1 jour</label>
</div>
<div class="settings">
<label><input type="checkbox" id="fvg" checked> FVG</label>
<label><input type="checkbox" id="structure" checked> BOS / CHoCH</label>
<label><input type="checkbox" id="liquidity" checked> Liquidité</label>
<label><input type="checkbox" id="levels" checked> Supports / résistances</label>
</div>
<small>Les détections automatiques seront ajoutées ensuite.</small>
</div>

<script>
const API_URL =
  "https://tradinganalyzer-api.cedricadjaito.workers.dev/";

const chartEl = document.getElementById("chart");
const statusEl = document.getElementById("status");

const chart = LightweightCharts.createChart(chartEl, {
  width: chartEl.clientWidth,
  height: chartEl.clientHeight,
  layout: {
    background: { color: "#101722" },
    textColor: "#d8e3f0"
  },
  grid: {
    vertLines: { color: "#1d2938" },
    horzLines: { color: "#1d2938" }
  },
  rightPriceScale: { borderColor: "#34445a" },
  timeScale: {
    borderColor: "#34445a",
    timeVisible: true,
    secondsVisible: false
  },
  crosshair: {
    mode: LightweightCharts.CrosshairMode.Normal
  }
});

const candlesSeries = chart.addCandlestickSeries({
  upColor: "#20b887",
  downColor: "#ef5350",
  borderUpColor: "#20b887",
  borderDownColor: "#ef5350",
  wickUpColor: "#20b887",
  wickDownColor: "#ef5350"
});

let currentInterval = "5min";
let loading = false;

async function loadCandles() {
  if (loading) return;
  loading = true;
  statusEl.textContent =
    "Chargement des bougies XAU/USD en " + currentInterval + "…";

  try {
    const response = await fetch(
      API_URL + "?interval=" + encodeURIComponent(currentInterval)
    );
    const data = await response.json();

    if (!response.ok || !Array.isArray(data.candles)) {
      throw new Error(data.error || "Données indisponibles");
    }

    const validCandles = data.candles.filter(c =>
      Number.isFinite(c.time) &&
      Number.isFinite(c.open) &&
      Number.isFinite(c.high) &&
      Number.isFinite(c.low) &&
      Number.isFinite(c.close)
    );

    candlesSeries.setData(validCandles);
    chart.timeScale().fitContent();

    statusEl.textContent =
      "XAU/USD • " + currentInterval +
      " • " + validCandles.length +
      " bougies chargées • Actualisation automatique toutes les 60 s.";
  } catch (error) {
    statusEl.textContent =
      "Erreur : " + error.message +
      ". Vérifie la connexion et les limites de l’API.";
  } finally {
    loading = false;
  }
}

document.querySelectorAll("[data-tf]").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll("[data-tf]").forEach(b =>
      b.classList.remove("active")
    );
    button.classList.add("active");
    currentInterval = button.dataset.tf;
    loadCandles();
  });
});

function resizeChart() {
  chart.applyOptions({
    width: chartEl.clientWidth,
    height: chartEl.clientHeight
  });
}

window.addEventListener("resize", resizeChart);

loadCandles();
setInterval(loadCandles, 60000);
const fvgTimeframes = ["15min", "1h", "4h", "1day"];
const fvgZones = [];

function detectFVG(candles, interval) {
  const zones = [];

  for (let i = 2; i < candles.length; i++) {
    const first = candles[i - 2];
    const third = candles[i];

    // FVG haussier : le plus bas de la 3e bougie
    // reste au-dessus du plus haut de la 1re.
    if (third.low > first.high) {
      zones.push({
        type: "bullish",
        interval,
        low: first.high,
        high: third.low,
        time: third.time,
        mitigated: false
      });
    }

    // FVG baissier : le plus haut de la 3e bougie
    // reste sous le plus bas de la 1re.
    if (third.high < first.low) {
      zones.push({
        type: "bearish",
        interval,
        low: third.high,
        high: first.low,
        time: third.time,
        mitigated: false
      });
    }
  }

  return zones;
}

async function loadFVGForTimeframe(interval) {
  const response = await fetch(
    API_URL + "?interval=" + encodeURIComponent(interval)
  );

  const data = await response.json();

  if (!response.ok || !Array.isArray(data.candles)) {
    throw new Error("Impossible de charger les FVG " + interval);
  }

  return detectFVG(data.candles, interval);
  }
      
</script>
</body>
</html>
